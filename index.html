<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bebenbau">
<meta name="theme-color" content="#ffb703">
<meta name="description" content="Bebenbau – Brücken und Türme bauen, die Lkw, Sturm und Erdbeben aushalten.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Bebenbau</title>
<style>:root { --y: #ffb703; --o: #f57c00; --d: #1e2430; --card: #fffdf6; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #6fb6ec; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, "DejaVu Sans", sans-serif; color: var(--d); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
canvas { position: fixed; inset: 0; touch-action: none; display: block; }
button { font: inherit; border: 0; cursor: pointer; color: inherit; }
.hidden { display: none !important; }
.screen { position: fixed; inset: 0; padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px); display: flex; flex-direction: column; }
#title { align-items: center; justify-content: flex-start; padding-top: calc(var(--safe-t) + 9vh); text-align: center; }
.logo { background: var(--d); border-radius: 14px; padding: 6px 0; width: min(92vw, 400px); box-shadow: 0 8px 0 rgba(0,0,0,0.25); transform: rotate(-2deg); animation: wob 3s ease-in-out infinite; }
@keyframes wob { 0%, 70%, 100% { transform: rotate(-2deg); } 75% { transform: rotate(1deg) translateX(3px); } 80% { transform: rotate(-4deg) translateX(-3px); } 85% { transform: rotate(0deg); } }
.logo h1 { margin: 4px 0; font-size: clamp(44px, 14vw, 64px); letter-spacing: 2px; color: #fff; font-weight: 900; }
.logo h1 span { color: var(--y); }
.stripes { height: 12px; margin: 0 10px; border-radius: 3px; background: repeating-linear-gradient(-45deg, var(--y) 0 12px, var(--d) 12px 24px); }
.tag { font-size: 17px; font-weight: 600; background: rgba(255,255,255,0.75); padding: 10px 14px; border-radius: 12px; margin: 22px 0; }
.tbtns { display: flex; flex-direction: column; gap: 10px; width: min(80vw, 300px); }
.tbtns button, .btns button { background: #fff; padding: 13px 16px; border-radius: 14px; font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 rgba(0,0,0,0.18); }
button.big { background: var(--y) !important; font-size: 20px !important; padding: 15px 18px !important; box-shadow: 0 5px 0 #c98a00 !important; }
button:active { transform: translateY(2px); }
.foot { margin-top: auto; font-size: 12px; opacity: 0.7; background: rgba(255,255,255,0.6); padding: 4px 8px; border-radius: 8px; }
/* Levelauswahl */
#levels { background: linear-gradient(#ffd166, #ffb703); overflow-y: auto; }
.lhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.lhead h2 { margin: 0; flex: 1; font-size: 26px; font-weight: 900; }
#startotal { font-weight: 800; background: var(--d); color: var(--y); padding: 5px 10px; border-radius: 10px; }
#levelgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lvl { position: relative; text-align: left; background: #fffdf6; border-radius: 14px; padding: 10px 10px 8px; min-height: 118px; box-shadow: 0 4px 0 rgba(0,0,0,0.18); display: flex; flex-direction: column; gap: 4px; }
.lvl.quake { background: linear-gradient(160deg, #fffdf6 60%, #ffe1d6); }
.lvl.locked { opacity: 0.55; filter: grayscale(0.8); }
.lnr { font-size: 26px; font-weight: 900; line-height: 1; color: var(--o); }
.lname { font-weight: 800; font-size: 15px; line-height: 1.15; }
.badges { display: flex; flex-wrap: wrap; gap: 3px; }
.badge { font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 6px; color: #fff; background: #555; }
.badge.beben { background: #c1121f; } .badge.sturm { background: #4361ee; } .badge.lkw { background: #6c757d; } .badge.turm { background: #2a9d8f; } .badge.steg { background: #8d6a9f; }
.lstars { margin-top: auto; font-size: 18px; font-weight: 700; }
.st.on { color: #f4a100; text-shadow: 0 1px 0 #a66d00; } .st.off { color: #d9d4c4; }
.linkbtn { background: transparent; text-decoration: underline; margin: 18px auto 6px; font-size: 13px; opacity: 0.75; }
/* HUD */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 6px) 8px 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.top { display: flex; align-items: center; gap: 6px; }
.icon { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.92); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,0.15); flex: none; }
.icon svg { width: 24px; height: 24px; }
#bsound .x { display: none; } #bsound.off .x { display: inline; } #bsound.off .wave { display: none; }
.tmid { flex: 1; min-width: 0; background: rgba(255,255,255,0.92); border-radius: 12px; padding: 4px 10px 5px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
#ltitle { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bwrap { position: relative; height: 18px; background: #e7e2d3; border-radius: 9px; overflow: hidden; margin-top: 2px; }
#budgetbar { position: absolute; left: 0; top: 0; bottom: 0; background: #52b788; transition: width .2s; }
#budgetbar.g2 { background: #95c623; } #budgetbar.g1 { background: #f4a100; } #budgetbar.over { background: #e63946; }
#budget { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 800; line-height: 18px; }
#budget.over { color: #fff; }
#loadchip { margin: 6px auto 0; width: fit-content; max-width: 100%; font-size: 11.5px; font-weight: 700; background: rgba(30,36,48,0.78); color: #fff; padding: 4px 9px; border-radius: 9px; text-align: center; }
#warn { display: none; margin: 6px auto 0; width: fit-content; font-size: 12.5px; font-weight: 800; background: #e63946; color: #fff; padding: 5px 10px; border-radius: 9px; }
#warn.on { display: block; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.75; } }
/* Werkzeuge */
#tools, #testbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 8px calc(var(--safe-b) + 8px); background: rgba(255,253,246,0.95); border-top: 3px solid var(--d); box-shadow: 0 -4px 14px rgba(0,0,0,0.15); }
#tools::before, #testbar::before { content: ""; position: absolute; left: 0; right: 0; top: -9px; height: 6px; background: repeating-linear-gradient(-45deg, var(--y) 0 8px, var(--d) 8px 16px); }
#matinfo { font-size: 12px; text-align: center; margin-bottom: 5px; color: #444; min-height: 15px; }
#mats { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
#mats::-webkit-scrollbar { display: none; }
.mat { flex: 1 0 64px; background: #fff; border-radius: 10px; padding: 5px 3px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid #ddd; }
.mat.sel { border-color: var(--d); background: #ffe8a8; box-shadow: 0 0 0 2px var(--y) inset; }
.sw { width: 34px; height: 8px; border-radius: 3px; display: block; }
.sw.seil { height: 3px; margin: 2px 0 3px; } .sw.beton, .sw.mauer { height: 11px; }
.mn { font-size: 11px; font-weight: 800; white-space: nowrap; } .mc { font-size: 10.5px; color: #666; }
.acts { display: flex; gap: 6px; }
.acts button { flex: 1; background: #fff; border-radius: 12px; padding: 6px 2px 5px; font-size: 11.5px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); border: 2px solid #e5e0d0; }
.acts button svg { width: 22px; height: 22px; }
.acts button.on { background: var(--d); color: var(--y); border-color: var(--d); }
.acts button:disabled { opacity: 0.4; }
.acts button.go { flex: 1.6; background: #2a9d48; color: #fff; border-color: #1f7a37; font-size: 15px; box-shadow: 0 3px 0 #186a2e; }
#bdel.on { background: #e63946; color: #fff; border-color: #b71c2a; }
#bspeed { font-size: 18px; justify-content: center; }
#tstatus { text-align: center; font-weight: 800; font-size: 14px; margin-bottom: 6px; min-height: 18px; }
/* Karten */
#modal { position: fixed; inset: 0; background: rgba(20,24,32,0.35); display: flex; align-items: center; justify-content: center; padding: calc(var(--safe-t) + 12px) 12px calc(var(--safe-b) + 12px); }
#card { width: min(100%, 420px); max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 18px; padding: 16px; box-shadow: 0 10px 0 rgba(0,0,0,0.2); border: 3px solid var(--d); }
#modal:has(#card.bottom) { align-items: flex-end; background: rgba(20,24,32,0.08); }
#card.bottom { max-height: 54vh; }
.ihead h2 { margin: 2px 0 6px; font-size: 25px; font-weight: 900; }
.inr { font-weight: 800; color: var(--o); font-size: 14px; }
.idesc { font-size: 16px; margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.chip { background: var(--d); color: #fff; font-size: 12.5px; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
.ibudget { font-size: 14px; margin: 6px 0; }
.tut { font-size: 14px; padding-left: 18px; margin: 8px 0; background: #fff3c4; border-radius: 10px; padding: 8px 8px 8px 26px; }
.tut li { margin: 3px 0; }
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btns button { flex: 1; }
.btns.small button { font-size: 14px; padding: 9px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); background: #f1ecdc; }
.rhead { text-align: center; }
.rhead h2 { margin: 0; font-size: 30px; font-weight: 900; }
.rhead.win h2 { color: #1f8a3b; } .rhead.fail h2 { color: #d62828; }
.rhead p { margin: 4px 0 6px; font-weight: 600; }
.bigstars { font-size: 40px; line-height: 1.1; }
.explain { background: #fff; border: 2px dashed #c9c2ad; border-radius: 12px; padding: 8px 10px; font-size: 14px; }
.explain p { margin: 4px 0; } .explain .et { font-weight: 800; }
.hl { display: inline-block; background: #ff28c8; color: #fff; font-weight: 800; font-size: 11px; padding: 1px 6px; border-radius: 6px; }
.tog { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; margin-top: 8px; }
.tog input { width: 20px; height: 20px; }
#toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 110px); transform: translate(-50%, -20px); background: var(--d); color: #fff; padding: 9px 14px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (orientation: landscape) and (max-height: 500px) { .tag { margin: 10px 0; } #title { padding-top: 12px; } }
/* Lernen (Technische Mechanik) */
#lernen { background: linear-gradient(#cfe8ff, #9fd0f5); overflow-y: auto; z-index: 5; }
#lernen .lsub { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.chap { background: rgba(255,255,255,0.55); border-radius: 16px; padding: 10px; margin-bottom: 12px; }
.chead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; font-size: 17px; }
.chead b { flex: 1; } .cnr { font-weight: 800; color: var(--o); font-size: 13px; } .cprog { font-weight: 800; background: var(--d); color: var(--y); padding: 2px 8px; border-radius: 8px; font-size: 13px; }
.les { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #fffdf6; border-radius: 12px; padding: 9px 10px; margin-bottom: 7px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
.les.done { background: #e6f6e9; }
.lnr2 { font-size: 20px; font-weight: 900; color: var(--o); min-width: 34px; }
.lnm { flex: 1; font-weight: 800; font-size: 15px; } .lnm small { display: block; font-weight: 600; font-size: 12px; color: #666; }
.lck { font-size: 20px; font-weight: 900; color: #1f8a3b; }
.note { background: #fff3c4; border-radius: 12px; padding: 8px 10px; font-size: 13.5px; margin-top: 6px; }
.lcard { background: var(--card); border: 3px solid var(--d); border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; font-size: 15px; }
.lcard p { margin: 6px 0; }
.lsec { font-weight: 800; color: var(--o); font-size: 13px; }
.ltask { font-weight: 700; }
svg.lg { width: 100%; height: auto; display: block; background: #fff; border-radius: 10px; border: 1px solid #e5e0d0; margin: 6px 0; }
.fm { font-family: "DejaVu Serif", Georgia, serif; font-style: italic; }
.fbox { background: #eef5ff; border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: 15px; line-height: 1.5; }
.lsl { display: grid; grid-template-columns: 1fr 72px; grid-template-rows: auto auto; gap: 2px 8px; margin: 8px 0; font-size: 13.5px; font-weight: 700; }
.lsl input { grid-column: 1 / 3; width: 100%; height: 28px; accent-color: var(--o); }
.lsl b { text-align: right; grid-row: 1; grid-column: 2; }
#lstat { font-size: 13.5px; font-weight: 700; text-align: center; min-height: 20px; }
.lamp { display: inline-block; margin: 2px 3px; padding: 3px 8px; border-radius: 9px; color: #fff; font-weight: 800; font-size: 13px; }
.lamp.g { background: #2a9d48; } .lamp.r { background: #e63946; } .lamp.o { background: #9aa0a6; }
.mini { font-size: 12px; font-weight: 600; color: #444; margin-top: 3px; }
.okc { color: #1f8a3b; } .okh { font-size: 22px; font-weight: 900; color: #1f8a3b; margin: 0 0 4px !important; }
.lbad { background: #ffe1df; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px; margin-top: 6px; }
.slots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 2px 0 8px; }
.slot { background: #fff; border: 2px solid #3a6ea5; border-radius: 10px; padding: 7px 9px; font-weight: 800; font-size: 13px; }
.slot.fix { border-color: #999; color: #555; }
.lt { border-collapse: collapse; font-size: 12px; width: 100%; } .lt th, .lt td { border: 1px solid #d8d1bd; padding: 3px 4px; text-align: left; } .lt th { background: #f1ecdc; }
#lernen .btns { margin-bottom: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="screen">
  <div class="logo"><div class="stripes"></div><h1>BEBEN<span>BAU</span></h1><div class="stripes"></div></div>
  <p class="tag">Bau es so, dass es hält.<br>Lkw, Sturm und Erdbeben warten schon.</p>
  <div class="tbtns"><button id="play" class="big">Spielen</button><button id="learn">Lernen</button><button id="titlesound">Ton an</button></div>
  <p class="foot">Prototyp · Lastfälle und Lerninhalte: Vegapunk · Prüfung: Whitebeard · Bau: Franky</p>
</div>

<div id="levels" class="screen hidden">
  <div class="lhead"><button id="lback" class="icon" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Baustellen</h2><span id="startotal"></span></div>
  <div id="levelgrid"></div>
  <button id="unlockall" class="linkbtn"></button>
</div>

<div id="lernen" class="screen hidden"></div>

<div id="hud" class="hidden">
  <div class="top">
    <button id="bback" class="icon" aria-label="Levelauswahl"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="tmid"><div id="ltitle"></div><div class="bwrap"><div id="budgetbar"></div><span id="budget"></span></div></div>
    <button id="binfo" class="icon" aria-label="Info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 11v6M12 7.2v.1" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></button>
    <button id="bsound" class="icon" aria-label="Ton"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>
  <div id="loadchip"></div>
  <div id="warn"></div>
</div>

<div id="tools" class="hidden">
  <div id="matinfo"></div>
  <div id="mats"></div>
  <div class="acts">
    <button id="bundo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg>Zurück</button>
    <button id="bdel"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>Löschen</button>
    <button id="bstat"><svg viewBox="0 0 24 24"><path d="M3 19 12 5l9 14zM12 5v14M7.5 12h9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Statik</button>
    <button id="bfit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Ansicht</button>
    <button id="btest" class="go"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>Test</button>
  </div>
</div>

<div id="testbar" class="hidden">
  <div id="tstatus"></div>
  <div class="acts">
    <button id="bstop"><svg viewBox="0 0 24 24"><path d="M14.5 4.5 19.5 9.5 9 20H4v-5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>Bauen</button>
    <button id="bspeed">×1</button>
    <button id="tforces"><svg viewBox="0 0 24 24"><path d="M4 12h13M13 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Kräfte</button>
  </div>
</div>

<div id="modal" class="hidden"><div id="card"></div></div>

<script>window.LEVELDATA = {"hinweis": "Spielwerte, an reale Größenordnungen angelehnt, aber für Spielbarkeit vereinfacht. Keine Bemessungswerte. Erdbebenlast als horizontale Ersatzkraft F = pga_g * Masse * g, pulsierend mit frequenz_hz.", "materialien": [{"name": "Holz", "max_zug_kN": 60, "max_druck_kN": 45, "gewicht_kg_pro_m": 8, "kosten_pro_m": 10}, {"name": "Stahlseil", "max_zug_kN": 120, "max_druck_kN": 0, "gewicht_kg_pro_m": 3, "kosten_pro_m": 15}, {"name": "Stahlprofil", "max_zug_kN": 250, "max_druck_kN": 200, "gewicht_kg_pro_m": 25, "kosten_pro_m": 40}, {"name": "Stahlbeton", "max_zug_kN": 30, "max_druck_kN": 400, "gewicht_kg_pro_m": 120, "kosten_pro_m": 30}, {"name": "Mauerwerk", "max_zug_kN": 5, "max_druck_kN": 150, "gewicht_kg_pro_m": 90, "kosten_pro_m": 12}], "levels": [{"nr": 1, "name": "Feldweg", "beschreibung": "Ein Pkw muss über den Graben.", "spannweite_m": 6, "budget": 220, "ankerpunkte": [[0, 0], [6, 0]], "last": {"typ": "lkw", "gewicht_t": 1.5, "geschwindigkeit_kmh": 20}}, {"name": "Baustellenzufahrt", "nr": 2, "beschreibung": "Der Betonmischer kommt. Mittelstütze erlaubt.", "spannweite_m": 10, "budget": 500, "ankerpunkte": [[0, 0], [5, -3], [10, 0]], "last": {"typ": "lkw", "gewicht_t": 12, "geschwindigkeit_kmh": 15}}, {"nr": 3, "name": "Steg an der Alster", "beschreibung": "Fußgängersteg im Herbststurm. Leicht bauen, gut aussteifen.", "spannweite_m": 14, "budget": 900, "ankerpunkte": [[0, 0], [14, 0], [0, 4], [14, 4]], "last": {"typ": "sturm", "wind_kmh": 100, "boen_kmh": 130, "dauer_s": 20}}, {"nr": 4, "name": "Tiefgaragenrampe", "beschreibung": "Lkw mit 20 % Steigung, Bremskraft beachten.", "spannweite_m": 12, "budget": 780, "ankerpunkte": [[0, 0], [12, -2.4], [6, -4]], "last": {"typ": "lkw", "gewicht_t": 18, "geschwindigkeit_kmh": 10, "bremsen": true}}, {"nr": 5, "name": "Erstes Beben", "beschreibung": "Ein dreistöckiger Turm muss ein leichtes Beben überstehen.", "spannweite_m": 6, "budget": 1200, "ankerpunkte": [[0, 0], [3, 0], [6, 0]], "las <script>/* Bebenbau – Kern: Konfiguration, Materialien, Hilfsfunktionen */
(function () {
'use strict';
const BB = globalThis.BB = globalThis.BB || {};
const G = 9.81;
const CFG = {
  dt: 1 / 60,
  substeps: 40,
  stiff: 120,          // Dehnsteifigkeit EA = stiff * max. Tragkraft  (=> ca. 0,8 % Dehnung beim Versagen)
  strength: 1.0,       // globaler Faktor auf alle Tragkräfte
  lRef: 6,             // Knicklänge: Druckstäbe länger als lRef verlieren Tragkraft mit (lRef/L)^2
  windDepthBridge: 3,  // m Breite, die bei Brücken Wind fängt (Fahrbahnbreite)
  windDepthTower: 0.25,  // m Breite pro Stab bei Türmen (Planen, Fassade)
  quakeQ: 1.0,         // Verhaltensbeiwert q (Duktilität, vgl. EN 1998): Ersatzkraft F = pga·m·g / q
  damping: 1.0,        // 1/s Geschwindigkeitsdämpfung (~5 % Bauwerksdämpfung)
  jointMass: 5,        // kg pro Knoten (Knotenblech)
  gravRamp: 0.6,       // s Hochlaufzeit der Schwerkraft

const STYLE = {
  'holz': { color: '#b4783a', dark: '#7a4a1e', w: 0.22, icon: 'holz' },
  'stahlseil': { color: '#2f343a', dark: '#111', w: 0.07, icon: 'seil' },
  'stahlprofil': { color: '#3f6c99', dark: '#22415f', w: 0.2, icon: 'stahl' },
  'stahlbeton': { color: '#a3a39d', dark: '#6c6c66', w: 0.3, icon: 'beton' },
  'mauerwerk': { color: '#b8553c', dark: '#7b2f1f', w: 0.3, icon: 'mauer' },
};
const FALLBACK_COLORS = ['#8a6', '#a68', '#68a', '#aa6', '#6aa'];

function num(v, d) { const n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; }

function prepMaterials(raw) {
  raw = Array.isArray(raw) && raw.length ? raw : [{ name: 'Holz', max_zug_kN: 60, max_druck_kN: 45, gewicht_kg_pro_m: 8, kosten_pro_m: 10 }];
  return raw.map((m, i) => {
    const name = String(m.name || ('Material ' + (i + 1)));
    const st = STYLE[name.toLowerCase()] || { color: FALLBACK_COLORS[i % 5], dark: '#333', w: 0.2, icon: 'stahl' };
    const zug = Math.max(0, num(m.max_zug_kN, 50)) * 1000;
    const druck = Math.max(0, num(m.max_druck_kN, 50)) * 1000;
    return {
      name, zug, druck, kgpm: Math.max(0.5, num(m.gewicht_kg_pro_m, 10)), cost: Math.max(0, num(m.kosten_pro_m, 10)),

    };
  });

Object.assign(BB, { G, CFG, STYLE, num, prepMaterials });
if (typeof module !== 'undefined' && module.exports) module.exports = BB;
})();

/* Bebenbau – Level-Aufbereitung (Lastfälle aus lastfaelle.json), Raster, Validierung, Kosten */
(function () {
'use strict';
const BB = globalThis.BB = globalThis.BB || {};
const { G, CFG, num } = BB;
function vehicleSpec(t) {
  if (t <= 3.5) return { kind: 'pkw', length: 4.2, axles: [0.7, 3.3], name: 'Pkw' };
  if (t <= 16) return { kind: 'mischer', length: 7.5, axles: [0.9, 4.8, 6.2], name: 'Betonmischer' };
  return { kind: 'lkw', length: 10, axles: [0.9, 2.2, 7.5, 8.8], name: 'Lkw' };
}

function prepLevel(raw, idx) {
  const L = raw.last || {};
  const typ = String(L.typ || '').toLowerCase();
  let anchors = (Array.isArray(raw.ankerpunkte) && raw.ankerpunkte.length ? raw.ankerpunkte : [[0, 0], [num(raw.spannweite_m, 8), 0]])
    .map(p => ({ x: num(Array.isArray(p) ? p[0] : p.x, 0), y: num(Array.isArray(p) ? p[1] : p.y, 0) }));
  // doppelte Anker entfernen
  anchors = anchors.filter((a, i) => anchors.findIndex(b => Math.abs(a.x - b.x) < 1e-6 && Math.abs(a.y - b.y) < 1e-6) === i);
  const xs = anchors.map(a => a.x), ys = anchors.map(a => a.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const span = num(raw.spannweite_m, maxX - minX);
  const H = num(L.turmhoehe_m, num(raw.turmhoehe_m, 0));
  const kind = H > 0 ? 'tower' : 'bridge';
  const lv = {
    nr: num(raw.nr, idx + 1), name: String(raw.name || ('Level ' + (idx + 1))), beschreibung: String(raw.beschreibung || ''),
    budget: num(raw.budget, 1000), span, anchors, kind, H, raw,
    quake: null, wind: null, truck: null, walkers: null, payload: 0,
  };
  if (typ === 'erdbeben' || L.pga_g !== undefined) {
    lv.quake = { pga: num(L.pga_g, 0.2), f: num(L.frequenz_hz, 1.5), dur: num(L.dauer_s, 10) };
  }
  if (typ === 'sturm' || L.wind_kmh !== undefined) {
    const v = num(L.wind_kmh, 90);
    lv.wind = { v: v / 3.6, gust: num(L.boen_kmh, v * 1.3) / 3.6, dur: num(L.dauer_s, 15) };
  }
  const truckT = typ === 'lkw' ? num(L.gewicht_t, 3) : num(L.zusatz_lkw_t, 0);
  if (truckT > 0) lv.truck = { t: truckT, kmh: num(L.geschwindigkeit_kmh, 15), brake: !!L.bremsen, spec: vehicleSpec(truckT) };
  lv.payload = num(L.nutzlast_t, 0) * 1000;
  if (kind === 'bridge') {
    const leftC = anchors.filter(a => Math.abs(a.x - minX) < 1e-6).sort((a, b) => Math.abs(a.y) - Math.abs(b.y));
    const rightC = anchors.filter(a => Math.abs(a.x - maxX) < 1e-6).sort((a, b) => Math.abs(a.y) - Math.abs(b.y));
    lv.roadA = leftC[0]; lv.roadB = rightC[0];
    if (!lv.truck) lv.walkers = { n: 4, kg: 90, speed: 1.3 };
  }
  const width = maxX - minX;
  const height = kind === 'tower' ? H : Math.max(...ys) - Math.min(...ys);
  lv.grid = Math.max(width, height) <= 16 ? 1 : 2;
  const g = lv.grid;
  if (kind === 'bridge') {
    const ry = [lv.roadA.y, lv.roadB.y];
    const extra = Math.max(2, Math.min(6, lv.span * 0.3));
    lv.bx0 = lv.roadA.x; lv.bx1 = lv.roadB.x;
    lv.by0 = Math.floor(Math.min(Math.min(...ys), Math.min(...ry) - extra) / g) * g;
    lv.by1 = Math.ceil(Math.max(Math.max(...ys), Math.max(...ry) + extra) / g) * g;
    lv.gapBottom = Math.min(lv.by0, Math.min(...ys)) - 1.5;
    lv.sagLimit = Math.max(CFG.sagLimitMin, lv.span / 12);
  } else {
    lv.bx0 = Math.floor((minX - g) / g) * g; lv.bx1 = Math.ceil((maxX + g) / g) * g;
    lv.by0 = 0; lv.by1 = Math.ceil(H / g) * g + g;
    lv.gapBottom = 0;
  }
  lv.maxLen = g * 7;
  lv.snaps = snapPoints(lv);
  return lv;
}

function onRoad(lv, x, y) {
  if (!lv.roadA) return false;
  const a = lv.roadA, b = lv.roadB;
  if (x < a.x - 1e-6 || x > b.x + 1e-6) return false;
  const yy = a.y + (b.y - a.y) * (x - a.x) / ((b.x - a.x) || 1);
  return Math.abs(yy - y) < 1e-3;
}
function roadY(lv, x) { const a = lv.roadA, b = lv.roadB; return a.y + (b.y - a.y) * (x - a.x) / ((b.x - a.x) || 1); }
function groundAt(lv, x) {
  if (lv.kind === 'tower') return 0;
  if (x <= lv.roadA.x) return lv.roadA.y;
  if (x >= lv.roadB.x) return lv.roadB.y;
  return lv.gapBottom;
}

function snapPoints(lv) {
  const g = lv.grid, pts = [];
  const key = (x, y) => Math.round(x * 1000) + ',' + Math.round(y * 1000);
  const seen = new Set();
  const add = (x, y, road) => { const k = key(x, y); if (seen.has(k)) return; seen.add(k); pts.push({ x, y, road: !!road }); };
  lv.anchors.forEach(a => add(a.x, a.y, onRoad(lv, a.x, a.y)));
  if (lv.roadA) {
    for (let x = Math.ceil(lv.roadA.x / g) * g; x <= lv.roadB.x + 1e-9; x += g) add(x, roadY(lv, x), true);
  }
  for (let x = Math.ceil(lv.bx0 / g) * g; x <= lv.bx1 + 1e-9; x += g)
    for (let y = lv.by0; y <= lv.by1 + 1e-9; y += g) {
      if (lv.kind === 'bridge' && lv.roadA && Math.abs(lv.roadA.y - lv.roadB.y) > 1e-6) {
        // Rampe: Rasterpunkte zu nah an der Fahrbahn weglassen
        const ry = roadY(lv, x);
        if (Math.abs(ry - y) < g * 0.35 && Math.abs(ry - y) > 1e-3) continue;
      }
      add(x, y, onRoad(lv, x, y));
    }
  return pts;
}

function designCost(design, mats) {
  let c = 0;
  for (const [a, b, m] of design.members) {
    const p = design.nodes[a], q = design.nodes[b];
    c += Math.hypot(p[0] - q[0], p[1] - q[1]) * (mats[m] ? mats[m].cost : 0);
  }
  return Math.round(c);
}
function stars(cost, budget) { if (cost > budget) return 0; if (cost <= budget * 0.7) return 3; if (cost <= budget * 0.85) return 2; return 1; }

function payloadNodeIdx(lv, design) {
  const out = [];
  design.nodes.forEach((p, i) => { if (p[1] >= lv.H - 0.01) out.push(i); });
  return out;
}

function validate(lv, design) {
  if (!design.members.length) return 'Bau zuerst ein paar Stäbe!';
  if (lv.kind === 'tower') {
    const used = new Set(); design.members.forEach(m => { used.add(m[0]); used.add(m[1]); });
    if (!payloadNodeIdx(lv, design).some(i => used.has(i))) return 'Der Turm muss bis zur Zielhöhe von ' + fmt(lv.H) + ' m reichen.';
  } else {
    // Fahrbahn durchgehend?
    const segs = design.members.filter(m => onRoad(lv, ...design.nodes[m[0]]) && onRoad(lv, ...design.nodes[m[1]]))
      .map(m => [Math.min(design.nodes[m[0]][0], design.nodes[m[1]][0]), Math.max(design.nodes[m[0]][0], design.nodes[m[1]][0])]).sort((a, b) => a[0] - b[0]);
    let reach = lv.roadA.x;
    for (const s of segs) if (s[0] <= reach + 1e-6) reach = Math.max(reach, s[1]);
    if (reach < lv.roadB.x - 1e-6) return 'Die Fahrbahn (gestrichelte Linie) muss durchgehend gebaut sein.';
  }
  return null;
}
function fmt(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }


Object.assign(BB, { vehicleSpec, prepLevel, onRoad, roadY, groundAt, snapPoints, designCost, stars, payloadNodeIdx, validate, fmt });
if (typeof module !== 'undefined' && module.exports) module.exports = BB;
})();

/* Bebenbau – Physik: 2D-Fachwerk mit XPBD (kleine Teilschritte), Stabkräfte, Auflagerkräfte, Versagen */
(function () {
'use strict';
const BB = globalThis.BB = globalThis.BB || {};
const { G, CFG, payloadNodeIdx, onRoad, roadY, groundAt } = BB;
// deterministisches Rauschen
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

class Sim {
  constructor(lv, design, mats, opts) {
    opts = opts || {};
    this.lv = lv; this.mats = mats; this.unbreakable = !!opts.unbreakable;
    this.t = 0; this.done = false; this.result = null; this.events = [];
    this.nA = lv.anchors.length;
    const rand = rng(opts.seed || 7);
    this.nodes = design.nodes.map((p, i) => ({ x: p[0], y: p[1], px: p[0], py: p[1], bx: p[0], by: p[1], vx: 0, vy: 0, fixed: i < this.nA, m0: CFG.jointMass, extra: 0, fx: 0, fy: 0, deg: 0 }));
    this.members = [];
    design.members.forEach(([a, b, mi], k) => {
      const A = this.nodes[a], B = this.nodes[b], mat = mats[mi];
      if (!A || !B || !mat || a === b) return;
      const L0 = Math.hypot(A.x - B.x, A.y - B.y); if (L0 < 1e-6) return;
      const mass = mat.kgpm * L0;
      A.m0 += mass / 2; B.m0 += mass / 2; A.deg++; B.deg++;
      const EA = CFG.stiff * Math.max(mat.zug, mat.druck, 1000);
      this.members.push({
        id: k + 1, a, b, mi, mat, L0, peakRatio: 0, peakMode: '', mass, alpha: L0 / EA, broken: false, f: 0, acc: 0, ratio: 0, peakT: 0, peakC: 0,
        capT: mat.zug * CFG.strength, capC: mat.druck * CFG.strength * Math.min(1, (CFG.lRef / L0) ** 2),
        road: onRoad(lv, A.x, A.y) && onRoad(lv, B.x, B.y),
      });
    });
    this.failures = [];   // Reihenfolge des Versagens (für die Erklärung)
    this.reactions = this.nodes.slice(0, this.nA).map((n, i) => ({ i, x: n.x, y: n.y, rx: 0, ry: 0, peak: 0 }));
    this.roadMembers = this.members.filter(m => m.road);
    // Nutzlast (Turm)
    this.payloadNodes = [];
    if (lv.kind === 'tower') {
      this.payloadNodes = payloadNodeIdx(lv, design).filter(i => this.nodes[i].deg > 0 || this.nodes[i].fixed);
      const per = this.payloadNodes.length ? lv.payload / this.payloadNodes.length : 0;
      this.payloadNodes.forEach(i => { this.nodes[i].payload = per; });
    }
    // Fahrzeuge
    this.vehicles = [];
    if (lv.truck) {
      const sp = lv.truck.spec, m = lv.truck.t * 1000;
      this.vehicles.push({ kind: sp.kind, name: sp.name, mass: m, axles: sp.axles, length: sp.length, v0: lv.truck.kmh / 3.6, v: lv.truck.kmh / 3.6,
        s: lv.roadA.x - sp.length - 1.5, start: lv.quake ? 2.5 : 1.0, brake: lv.truck.brake ? 'pending' : null, holdT: 0, acc: 0,
        state: 'wait', ys: sp.axles.map(() => lv.roadA.y), fallT: 0, rot: 0, vy: 0, y: lv.roadA.y, endX: lv.roadB.x + 1.5 });
    }
    if (lv.walkers) {
      const w = lv.walkers;
      for (let k = 0; k < w.n; k++) this.vehicles.push({ kind: 'worker', name: 'Bauarbeiter', mass: w.kg, axles: [0], length: 0.5, v0: w.speed, v: w.speed,
        s: lv.roadA.x - 1 - k * 1.4, start: 1.0, brake: null, holdT: 0, acc: 0, state: 'wait', ys: [lv.roadA.y], fallT: 0, rot: 0, vy: 0, y: lv.roadA.y, endX: lv.roadB.x + 1 });
    }
    // Böen vorberechnen
    this.gusts = [];
    if (lv.wind) { let tt = CFG.loadStart + 1.5 + rand() * 1.5; while (tt < CFG.loadStart + lv.wind.dur) { this.gusts.push({ t: tt, d: 1.2 + rand() * 1.3 }); tt += 2.2 + rand() * 2.8; } }
    this.phase = rand() * 6.28;
    this.endTime = CFG.loadStart + Math.max(lv.quake ? lv.quake.dur : 0, lv.wind ? lv.wind.dur : 0) + 0.8;
    this.windNow = 0; this.quakeAcc = 0; this.quakeEnv = 0; this.brokenCount = 0;
  }
  quakeA(t) {
    const q = this.lv.quake; if (!q) return 0;
    const tt = t - CFG.loadStart; if (tt < 0 || tt > q.dur) return 0;
    const env = Math.min(1, tt / 1.0, (q.dur - tt) / 1.5);
    const w = 2 * Math.PI * q.f;
    const noise = 0.5 * Math.sin(2 * Math.PI * 3.7 * tt + 1 + this.phase) + 0.3 * Math.sin(2 * Math.PI * 5.3 * tt + 2) + 0.2 * Math.sin(2 * Math.PI * 0.6 * tt);
    this.quakeEnv = env;
    return q.pga * G / CFG.quakeQ * env * (Math.sin(w * tt) + 0.15 * noise);
  }
  windV(t) {
    const wd = this.lv.wind; if (!wd) return 0;
    const tt = t - CFG.loadStart; if (tt < 0 || tt > wd.dur) return 0;
    const env = Math.min(1, tt / 2, (wd.dur - tt) / 1.5);
    let gst = 0;
    for (const g of this.gusts) { const x = (t - g.t) / g.d; if (x > 0 && x < 1) gst = Math.max(gst, Math.sin(Math.PI * x) ** 2); }
    const turb = 0.04 * Math.sin(7.1 * tt + this.phase) + 0.03 * Math.sin(12.7 * tt);
    return env * (wd.v + (wd.gust - wd.v) * gst) * (1 + turb);
  }
  supportAt(x) {
    const lv = this.lv;
    if (x < lv.roadA.x || x > lv.roadB.x) return { ground: true, y: groundAt(lv, x) };
    for (const m of this.roadMembers) {
      if (m.broken) continue;
      const A = this.nodes[m.a], B = this.nodes[m.b];
      let xa = A.x, xb = B.x, ya = A.y, yb = B.y, ia = m.a, ib = m.b;
      if (xa > xb) { [xa, xb] = [xb, xa]; [ya, yb] = [yb, ya]; [ia, ib] = [ib, ia]; }

// 1.3 Rampe (schiefe Ebene)
function rampPic(deg, G, comps, est) {
  const a = deg * Math.PI / 180, x0 = 30, y0 = 190, len = 280, x1 = x0 + len * Math.cos(a), y1 = y0 - len * Math.sin(a);
  const t = 0.55, px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t, nx = -Math.sin(a), ny = -Math.cos(a);  // Normale (Bildschirm)
  const cx = px + nx * 18, cy = py + ny * 18, K = 9;
  let s = axes(26, 222) + `<polygon points="${x0},${y0} ${x1},${y0} ${x1},${y1}" fill="#e7e2d3" stroke="${DK}" stroke-width="2"/>`;
  s += `<path d="M${x0 + 40} ${y0} A 40 40 0 0 0 ${x0 + 40 * Math.cos(a)} ${y0 - 40 * Math.sin(a)}" fill="none" stroke="#555"/>` + txt(x0 + 56, y0 - 8, `α = ${deg}°`, '#555', 12);
  s += `<g transform="rotate(${-deg} ${cx} ${cy})">${boxAt(cx, cy, 40, 30)}</g>`;
  s += farr(cx, cy, 0, -G, K, RED, `G = ${de(G)} kN`);
  if (comps) {
    const d = comps.down, n = comps.normal, ux = -Math.cos(a), uz = -Math.sin(a), wx = Math.sin(a), wz = -Math.cos(a);
    s += farr(cx, cy, ux * d, uz * d, K, BLU, `${de(d, 1)} kN`) + farr(cx, cy, wx * n, wz * n, K, GRN, `${de(n, 1)} kN`);
  }
  return svg(s, 230, est ? 'tsvg' : '');
}

// 1.4 Wippe (Prüffall 0,3 kN × 2 m = 0,2 kN × 3 m = 0,6 kNm)
function seesawPic(a1, a2, id) {
  const m = seesaw(0.3, a1, 0.2, a2), ang = Math.max(-14, Math.min(14, m.net * 12)), cx = 170, cy = 140, k = 40;
  let s = axes(26, 214) + `<polygon points="${cx},${cy} ${cx - 14},${cy + 40} ${cx + 14},${cy + 40}" fill="#8d99ae" stroke="${DK}" stroke-width="2"/>` + hatch(cx - 30, cx + 30, cy + 40);
  s += `<g transform="rotate(${-ang} ${cx} ${cy})">${bar(cx - 3.5 * k, cx + 3.5 * k, cy - 4)}${kid(cx - a1 * k, cy - 8, '#e76f51', '30 kg')}${kid(cx + a2 * k, cy - 8, '#2a9d8f', '20 kg')}` +
    farr(cx - a1 * k, cy - 8, 0, -0.3, 80, RED, '') + farr(cx + a2 * k, cy - 8, 0, -0.2, 80, RED, '') + '</g>';
  s += txt(cx - 95, 40, `${de(0.3, 1)} kN × ${de(a1, 1)} m`, RED, 12) + txt(cx + 95, 40, `${de(0.2, 1)} kN × ${de(a2, 1)} m`, RED, 12);
  s += txt(cx - 95, 56, `= ${de(m.ML)} kNm`, RED, 12) + txt(cx + 95, 56, `= ${de(m.MR)} kNm`, RED, 12);
  return svg(s, 230, id);
}

// 1.5 Balanceakt
const BAL = { L: 6, loads: [[1, 6], [4, 3]], H0: 2 };
function balSums(st) { const Fz = st.S - 9, Fx = BAL.H0 + st.H, M = st.S * st.xs - (6 * 1 + 3 * 4); return { Fx, Fz, M }; }
function lbl(x, y, t, c, anchor = 'middle') {
  const w = t.length * 7.4 + 8, x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
  return `<rect x="${x0}" y="${y - 12}" width="${w}" height="16" rx="4" fill="#fff" stroke="${c}" stroke-width="1" opacity="0.95"/>` + `<text x="${x0 + w / 2}" y="${y}" fill="${c}" font-size="12" font-weight="800" text-anchor="middle">${t}</text>`;
}
function balPic(st, id) {
  const L = BAL.L, y = 100, X = x => bxp(x, L), z = balSums(st), ang = Math.max(-8, Math.min(8, z.M * 0.6)), xs = X(st.xs), hy = y + 4;
  let s = axes(26, 214) + `<g transform="rotate(${-ang} ${xs} ${hy})">` + bar(X(0), X(L), y);
  BAL.loads.forEach(([x, F]) => { s += farrTo(X(x), y - 5, 0, -F, 7, RED, '') + lbl(X(x), y - 5 - F * 7 - 6, `${de(F)} kN`, RED); });
  s += farrTo(X(0) - 1, y, BAL.H0, 0, 9, RED, '') + lbl(X(0) - 10, y - 12, `${de(BAL.H0)} kN`, RED, 'middle') + '</g>';
  s += supFest(xs, hy);  // Festlager: gelenkig, nimmt H und V auf, kein Moment
  if (st.H) s += farrTo(xs - (st.H < 0 ? -1 : 1) * 12, hy, st.H, 0, 9, BLU, '') + lbl(xs - (st.H < 0 ? -1 : 1) * (12 + Math.abs(st.H) * 9 + 4), hy + 4, `${de(Math.abs(st.H))} kN`, BLU, st.H < 0 ? 'start' : 'end');
  if (st.S) s += farrTo(xs, hy + 24, 0, st.S, 3.5, BLU, '') ;
  s += lbl(xs + 14, hy + 24 + st.S * 3.5 - 2, `${de(st.S)} kN ↑`, BLU, 'start');
  s += dim(X(0), xs, 216, `${de(st.xs)} m`);
  return svg(s, 230, id);
}

// 2.1 Welches Lager?
const TYPES = ['', 'los', 'fest', 'ein'];
const tName = t => t ? NAME[t] : 'kein Lager';
const BRIDGES = [

  { name: 'Brücke 2 (Balkon an der Wand)', L: 3, slots: [0], fixed: {} },

function supsOf(br, sel) { return br.slots.map((x, i) => ({ x, t: br.fixed[i] || sel[i] })).filter(s => s.t); }
function bridgePic(br, sel, id) {
  const sp = supsOf(br, sel), c = classify(sp, br.L);
  let s = beamPic({ L: br.L, sup: sp, y: 100, labels: [] }).replace(/^<svg[^>]*>|<\/svg>$/g, '');
  br.slots.forEach((x, i) => { if (!br.fixed[i] && !sel[i]) s += `<rect x="${bxp(x, br.L) - 16}" y="106" width="32" height="24" rx="5" fill="none" stroke="${BLU}" stroke-dasharray="4 3" stroke-width="2"/>` + txt(bxp(x, br.L), 123, '?', BLU); });
  s += txt(170, 30, br.name, DK, 14) + txt(170, 175, c.kind === 'bestimmt' ? 'statisch bestimmt ✓' : c.kind === 'unbestimmt' ? 'statisch unbestimmt' : 'beweglich', c.kind === 'bestimmt' ? GRN : RED, 13);
  return svg(s, 190, id);
}

/* Bebenbau – Spielablauf, Bedienung (Touch zuerst), Bildschirme, Speicherstand */

// ---------------- Werkzeugleiste ----------------

  $('ltitle').textContent = `${lv.nr} · ${lv.name}`;
  const bp = $('budget'); bp.textContent = `${cost} / ${lv.budget} €`; bp.classList.toggle('over', cost > lv.budget);
  const pct = Math.min(100, cost / lv.budget * 100);
  $('budgetbar').style.width = pct + '%'; $('budgetbar').className = cost > lv.budget ? 'over' : cost <= lv.budget * 0.7 ? 'g3' : cost <= lv.budget * 0.85 ? 'g2' : 'g1';

// ---------------- Entwurf bearbeiten ----------------
function pushUndo() { S.undo.push(JSON.stringify(S.design)); if (S.undo.length > 100) S.undo.shift(); }

  try { S.stat = S.design.members.length ? BB.Statics.analyzeDesign(S.lv, S.design, mats) : null; } catch (e) { S.stat = null; }
  S.statView = null;
  if (S.stat && S.stat.ok) {
    S.statView = S.stat.members.map((m, k) => {
      const f = S.stat.forces[k], buck = Math.min(1, (BB.CFG.lRef / m.L) ** 2);
      const capT = m.mat.zug * BB.CFG.strength, capC = m.mat.druck * BB.CFG.strength * buck;
      return { a: m.a, b: m.b, f, ratio: f >= 0 ? (capT > 0 ? f / capT : 9) : (capC > 0 ? -f / capC : (m.mat.cable ? 0 : 9)), id: m.id };

function nodeAt(x, y) { return S.design.nodes.findIndex(p => Math.abs(p[0] - x) < 1e-6 && Math.abs(p[1] - y) < 1e-6); }

// ---------------- Touch / Maus ----------------

  }
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { if (!S.lv) return; e.preventDefault(); const p = pos(e); const k = Math.exp(-e.deltaY * 0.0015); const s = Math.max(S.cam.fitS * 0.5, Math.min(Math.max(S.cam.fitS * 4, 140), S.cam.s * k)); const wx = (p.x - S.cam.ox) / S.cam.s, wy = (S.cam.oy - p.y) / S.cam.s; S.cam.s = s; S.cam.ox = p.x - wx * s; S.cam.oy = p.y + wy * s; }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------------- Test ----------------
function startTest(sameSeed) {
  const err = BB.validate(S.lv, S.design);
  if (err) { toast(err); SND.remove(); return; }
  SND.init();
  if (!sameSeed) S.seed = 1 + Math.floor(Math.random() * 9999);
  S.sim = new BB.Sim(S.lv, S.design, mats, { seed: S.seed });
  S.screen = 'test'; S.acc = 0; S.doneT = 0; S.resultShown = false; S.highlight = null; S.debris = []; S.particles = []; S.mood = 'watch'; S.bubbles = [];
  show('tools', false); show('testbar', true); show('modal', false); $('warn').classList.remove('on');
  $('bspeed').textContent = '×' + S.speed;
  $('tforces').classList.toggle('on', S.showForces);
  fitCam();
  if (S.lv.quake) say(S.lv.quake.pga >= 0.3 ? 'Festhalten, das wird heftig!' : 'Gleich wackelt es …', 0.6);
  else if (S.lv.wind) say('Helm festhalten!', 0.6);
  else say('Na dann, Gas geben!', 0.3);
  SND.click();
}
function backToBuild() {
  S.screen = 'build'; S.sim = null; S.highlight = null; S.mood = 'idle'; S.debris = []; S.particles = [];
  show('testbar', false); show('tools', true); show('modal', false); SND.stopLoops(); updateHUD(); fitCam();
}
function say(text, delay) { S.bubbles = S.bubbles.filter(b => b.t0 > S.t + (delay || 0)); S.bubbles.push({ text, t0: S.t + (delay || 0), dur: 2.2 }); }
function stepSim() {
  const sim = S.sim;
  if (sim.done) { S.doneT += 1 / 60; if (S.doneT > 4) return; }
  const fallenBefore = sim.vehicles.filter(v => v.state === 'fall').length;
  const ev = sim.step();
  for (const e of ev) if (e.type === 'break') onBreak(e);
  if (sim.vehicles.filter(v => v.state === 'fall').length > fallenBefore) { SND.thud(); vib([60, 40, 60]); S.shake += 6; S.mood = 'panic'; say(sim.vehicles.some(v => v.state === 'fall' && v.kind === 'worker') ? 'Kollege, halt dich fest!' : 'Ach du Schande!'); }
  if (sim.done && !S.resultShown && S.doneT > (sim.result.win ? 0.6 : 1.4)) showResult();
}
function vib(p) { try { if (!SND.muted && navigator.vibrate) navigator.vibrate(p); } catch (e) { /* nicht unterstützt */ } }
function onBreak(e) {
  const heavy = /beton|mauer|stahlprofil/i.test(e.mat.name);
  SND.crack(heavy); vib(25); S.shake = Math.min(14, S.shake + (heavy ? 6 : 3));
  if (S.mood !== 'panic') { S.mood = 'panic'; say(['Da kracht was!', 'Oha!', 'Wer hat das gerechnet?!'][Math.floor(Math.random() * 3)]); }
  const mx = (e.ax + e.bx) / 2, my = (e.ay + e.by) / 2;
  for (const half of [[e.ax, e.ay, mx, my], [mx, my, e.bx, e.by]]) {
    const cx = (half[0] + half[2]) / 2, cy = (half[1] + half[3]) / 2;
    S.debris.push({ x: cx, y: cy, len: Math.hypot(half[2] - half[0], half[3] - half[1]), ang: Math.atan2(half[3] - half[1], half[2] - half[0]),
      vx: e.vx * 0.5 + (Math.random() - 0.5) * 3, vy: e.vy * 0.5 + Math.random() * 3, va: (Math.random() - 0.5) * 6, mat: e.mat, life: 6 });
  }
  for (let k = 0; k < 14; k++) S.particles.push({ x: mx, y: my, vx: (Math.random() - 0.5) * 6, vy: Math.random() * 5, life: 0.6 + Math.random() * 0.6, c: e.mat.color, r: 1 + Math.random() * 3 });
}
function showResult() {
  S.resultShown = true;
  const sim = S.sim, lv = S.lv, res = sim.result;
  const cost = BB.designCost(S.design, mats), over = cost > lv.budget;
  const st = res.win && !over ? BB.stars(cost, lv.budget) : 0;
  if (st > (prog.stars[lv.nr] || 0)) { prog.stars[lv.nr] = st; save(); }
  S.mood = res.win ? 'cheer' : 'panic';
  if (res.win) { SND.win(); say(over ? 'Hält, aber der Chef flucht über die Rechnung.' : ['Hält!', 'Statik passt!', 'Feierabend!', 'Läuft, Chef!'][Math.floor(Math.random() * 4)]); vib(40); }
  else { SND.fail(); vib([100, 50, 100]); }
  SND.stopLoops();
  const ex = BB.Explain.explain(sim, S.stat);
  S.highlight = ex.memberId;
  const next = S.li + 1 < levels.length ? S.li + 1 : -1;
  const head = res.win ? (over ? 'Hält – aber zu teuer!' : 'Hält!') : 'Eingestürzt!';
  const sub = res.win ? (over ? `Kosten ${cost} €, Budget ${lv.budget} €. Spar noch ${cost - lv.budget} € ein.` : `Kosten ${cost} von ${lv.budget} €`) : esc(res.reason || 'Das Bauwerk hat nicht gehalten.');
  modal(`<div class="rhead ${res.win ? 'win' : 'fail'}"><h2>${head}</h2>${res.win && !over ? `<div class="bigstars">${stars(st)}</div>` : ''}<p>${sub}</p></div>
    <div class="explain">${ex.memberId ? `<span class="hl">Stab ${ex.memberId}</span> ` : ''}<p class="et">${esc(ex.title || '')}</p>${ex.lines.map(l => `<p>${esc(l)}</p>`).join('')}</div>
    <label class="tog"><input type="checkbox" id="cforces" ${S.showForces ? 'checked' : ''}> Kräfte und Auflagerkräfte anzeigen</label>
    <div class="btns">${res.win && !over && next >= 0 ? '<button class="big" id="rnext">Weiter</button>' : ''}<button class="${res.win && !over ? '' : 'big'}" id="rbuild">${res.win ? 'Verbessern' : 'Nachbessern'}</button></div>
    <div class="btns small"><button id="rreplay">Nochmal ansehen</button><button id="rlevels">Levelauswahl</button></div>`);
  $('card').classList.add('bottom');
  requestAnimationFrame(() => { // Kamera so setzen, dass das Bauwerk über der Karte sichtbar bleibt
    const top = $('hud').getBoundingClientRect().bottom + 6, bot = $('card').getBoundingClientRect().top - 6;
    if (bot - top > 90) S.cam.fit(R.levelBounds(lv), { x: 10, y: top, w: S.W - 20, h: bot - top });
  });
  $('cforces').onchange = e => { S.showForces = e.target.checked; $('tforces').classList.toggle('on', S.showForces); };
  if ($('rnext')) $('rnext').onclick = () => { $('card').classList.remove('bottom'); startLevel(next); };
  $('rbuild').onclick = () => { $('card').classList.remove('bottom'); backToBuild(); };
  $('rreplay').onclick = () => { $('card').classList.remove('bottom'); startTest(true); };
  $('rlevels').onclick = () => { $('card').classList.remove('bottom'); goLevels(); };
}

// ---------------- Zeichnen ----------------
function updateFx(dt) {
  for (const d of S.debris) {
    d.vy -= 9.81 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.ang += d.va * dt; d.life -= dt;
    const gy = BB.groundAt(S.lv, d.x) + 0.1;
    if (d.y < gy) { d.y = gy; d.vy *= -0.3; d.vx *= 0.6; d.va *= 0.5; }
  }
  S.debris = S.debris.filter(d => d.life > 0);
  for (const p of S.particles) { p.vy -= 6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  S.particles = S.particles.filter(p => p.life > 0);
  S.shake *= Math.pow(0.02, dt);
  S.bubbles = S.bubbles.filter(b => S.t < b.t0 + b.dur);
}
function bystanders() {
  const lv = S.lv;
  if (lv.kind === 'tower') return [[lv.bx0 - 1.2, 0], [lv.bx0 - 2.3, 0]];
  return [[lv.roadB.x + 1.2, lv.roadB.y], [lv.roadB.x + 2.2, lv.roadB.y]];
}
function draw() {
  const W = S.W, H = S.H;
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  if (!S.lv) return drawTitle(W, H);
  const lv = S.lv, sim = S.screen === 'test' ? S.sim : null, cam = S.cam;
  const storm = sim ? Math.min(1, sim.windNow / 35) : (lv.wind ? 0.25 : 0);
  R.sky(ctx, W, H, S.t, storm);
  // Erschütterung
  const qa = sim ? sim.quakeAcc : 0;
  const qs = sim && lv.quake ? Math.min(12, Math.abs(qa) * 1.6) : 0;
  cam.shx = (Math.random() - 0.5) * S.shake + Math.sin(S.t * 2 * Math.PI * (lv.quake ? lv.quake.f : 1)) * qs;
  cam.shy = (Math.random() - 0.5) * S.shake * 0.6 + (Math.random() - 0.5) * qs * 0.3;
  const groundY = cam.Y(lv.kind === 'tower' ? 0 : lv.roadA.y);
  R.skyline(ctx, W, groundY + 2);
  R.crane(ctx, Math.min(W - 60, cam.X(lv.bx1 + 2.5)), groundY, Math.min(groundY - 120, 260), S.t, 0.9);
  R.terrain(ctx, cam, lv, W, H, S.t);
  // Raster, Fahrbahn, Ziel
  if (S.screen === 'build') {
    ctx.fillStyle = 'rgba(30,40,60,0.28)';
    const rr = Math.max(1.2, Math.min(2.5, cam.s * 0.05));
    for (const s of lv.snaps) { ctx.beginPath(); ctx.arc(cam.X(s.x), cam.Y(s.y), s.road ? rr * 1.6 : rr, 0, 6.283); ctx.fill(); }
  }
  if (lv.roadA && (S.screen === 'build')) {
    ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(40,40,40,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cam.X(lv.roadA.x), cam.Y(lv.roadA.y)); ctx.lineTo(cam.X(lv.roadB.x), cam.Y(lv.roadB.y)); ctx.stroke(); ctx.setLineDash([]);
  }
  if (lv.kind === 'tower') {
    ctx.setLineDash([10, 6]); ctx.strokeStyle = 'rgba(30,160,70,0.9)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cam.X(lv.bx0 - 1), cam.Y(lv.H)); ctx.lineTo(cam.X(lv.bx1 + 1), cam.Y(lv.H)); ctx.stroke(); ctx.setLineDash([]);
    R.pill(ctx, cam.X(lv.bx0 - 1) + 30, cam.Y(lv.H) - 12, `Ziel ${fmt(lv.H)} m`, 'rgba(30,160,70,0.95)', '#fff', 11);
  }
  // Bauwerk
  let P;
  if (sim) {
    P = i => [sim.nodes[i].x, sim.nodes[i].y];
    for (const m of sim.members) if (!m.broken) R.drawMember(ctx, cam, P(m.a), P(m.b), m.mat, { stress: m.ratio, highlight: S.highlight === m.id, t: S.t });
    const hl = S.highlight && sim.members.find(m => m.id === S.highlight && m.broken);
    if (hl) { // gebrochenen Stab als Geisterlinie markieren
      ctx.setLineDash([6, 5]); R.drawMember(ctx, cam, P(hl.a), P(hl.b), hl.mat, { ghost: true, highlight: true, t: S.t }); ctx.setLineDash([]);
    }
  } else {
    const d = S.design; P = i => d.nodes[i];
    const sv = S.showForces && S.statView;
    d.members.forEach((m, k) => R.drawMember(ctx, cam, d.nodes[m[0]], d.nodes[m[1]], mats[m[2]], { stress: sv ? sv[k] && sv[k].ratio : null, highlight: S.highlight === k + 1, t: S.t }));
    if (S.preview && S.preview.to) {
      const a = d.nodes[S.preview.from], b = S.preview.to, L = Math.hypot(b.x - a[0], b.y - a[1]), ok = L <= lv.maxLen + 1e-6;
      ctx.globalAlpha = 0.75; R.drawMember(ctx, cam, a, [b.x, b.y], mats[S.sel], {}); ctx.globalAlpha = 1;
      ctx.strokeStyle = ok ? '#1b7f3b' : '#d00'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cam.X(b.x), cam.Y(b.y), 12, 0, 6.283); ctx.stroke();
      R.pill(ctx, cam.X(b.x), cam.Y(b.y) - 26, `${fmt(L)} m · ${Math.round(L * mats[S.sel].cost)} €${ok ? '' : ' · zu lang'}`, ok ? 'rgba(20,20,20,0.8)' : '#d00', '#fff', 12);
    }
  }
  // Knoten
  const nn = sim ? sim.nodes.length : S.design.nodes.length, nA = lv.anchors.length;
  for (let i = 0; i < nn; i++) {
    if (sim && i >= nA && sim.nodes[i].deg <= 0) continue;
    const p = P(i); R.drawJoint(ctx, cam, p[0], p[1], i < nA);
  }
  if (S.preview && S.preview.from >= 0 && !sim) { const p = S.design.nodes[S.preview.from]; ctx.strokeStyle = '#ffb703'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cam.X(p[0]), cam.Y(p[1]), 14, 0, 6.283); ctx.stroke(); }
  // Nutzlast
  if (lv.kind === 'tower') {
    const idx = sim ? sim.payloadNodes : BB.payloadNodeIdx(lv, S.design).filter(i => i < nA || S.design.members.some(m => m[0] === i || m[1] === i));
    R.payload(ctx, cam, idx.map(P), lv.payload, S.t);
  }
  // Fahrzeuge
  if (sim) for (const v of sim.vehicles) R.vehicle(ctx, cam, v, S.t);
  else if (lv.truck) R.vehicle(ctx, cam, { kind: lv.truck.spec.kind, length: lv.truck.spec.length, axles: lv.truck.spec.axles, s: lv.roadA.x - lv.truck.spec.length - 1.5, ys: lv.truck.spec.axles.map(() => lv.roadA.y), state: 'wait', rot: 0, y: lv.roadA.y }, 0);
  // Zuschauer
  const by = bystanders();
  by.forEach((b, k) => R.worker(ctx, cam.X(b[0]), cam.Y(b[1]), Math.max(9, Math.min(24, cam.s * 0.9)), S.mood, S.t, k * 1.7));
  // Trümmer & Staub
  for (const d of S.debris) {
    ctx.save(); ctx.globalAlpha = Math.min(1, d.life); ctx.translate(cam.X(d.x), cam.Y(d.y)); ctx.rotate(-d.ang);
    ctx.strokeStyle = d.mat.color; ctx.lineWidth = Math.max(2, Math.min(12, d.mat.width * cam.s)); ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(-d.len / 2 * cam.s, 0); ctx.lineTo(d.len / 2 * cam.s, 0); ctx.stroke(); ctx.restore();
  }
  for (const p of S.particles) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.c; ctx.fillRect(cam.X(p.x), cam.Y(p.y), p.r, p.r); }
  ctx.globalAlpha = 1;
  // Kräfte
  if (S.showForces) {
    if (sim) R.forceOverlay(ctx, cam, P, sim.members, sim.reactions, sim.nodes.map(n => ({ x: n.x, y: n.y })));
    else if (S.statView) R.forceOverlay(ctx, cam, P, S.statView, S.stat.reactions, lv.anchors);
  }
  // Wind/Regen
  if (storm > 0.15) {
    ctx.strokeStyle = `rgba(255,255,255,${0.25 + storm * 0.3})`; ctx.lineWidth = 1;
    const n = Math.floor(30 + storm * 60);
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const x = ((i * 89 + S.t * (300 + storm * 900)) % (W + 100)) - 50, y = (i * 53 + S.t * 220) % H; ctx.moveTo(x, y); ctx.lineTo(x + 18 + storm * 30, y + 6); }
    ctx.stroke();
  }
  // Sprechblasen
  const b0 = by[0];
  const vis = S.bubbles.filter(b => S.t >= b.t0).slice(-1);
  for (const b of vis) R.bubble(ctx, cam.X(b0[0]), cam.Y(b0[1]) - Math.max(9, Math.min(24, cam.s * 0.9)) * 2.1, b.text);
  // Test-Status
  if (sim) updateTestbar(sim);
}
function updateTestbar(sim) {
  const lv = S.lv; let txt = '';
  const tt = sim.t - BB.CFG.loadStart;
  if (lv.quake && tt > 0 && tt < lv.quake.dur) txt = `Beben ${fmt(Math.abs(sim.quakeAcc / 9.81))} g · noch ${Math.ceil(lv.quake.dur - tt)} s`;
  else if (lv.wind && tt > 0 && tt < lv.wind.dur) txt = `Wind ${Math.round(sim.windNow * 3.6)} km/h · noch ${Math.ceil(lv.wind.dur - tt)} s`;
  else if (sim.vehicles.some(v => v.state === 'drive')) txt = sim.vehicles[0].kind === 'worker' ? 'Bauarbeiter unterwegs' : `${sim.vehicles[0].name} fährt`;
  if (sim.done) txt = sim.result.win ? 'Geschafft!' : 'Eingestürzt';
  if (sim.brokenCount && !sim.done) txt += ` · ${sim.brokenCount} ${sim.brokenCount > 1 ? 'Stäbe' : 'Stab'} gebrochen`;
  $('tstatus').textContent = txt;
  // Geräusche
  if (!sim.done) {
    SND.rumble(lv.quake ? Math.min(1, Math.abs(sim.quakeEnv) * lv.quake.pga * 2.2) : 0);
    SND.wind(lv.wind ? Math.min(1, sim.windNow / 45) : 0);
    const drv = sim.vehicles.find(v => v.state === 'drive' && v.kind !== 'worker');
    SND.engine(drv ? 1 : 0, drv ? drv.v : 0);
  }
}
// Titelbild
function drawTitle(W, H) {
  R.sky(ctx, W, H, S.t, 0);
  const gy = H * 0.78;
  R.skyline(ctx, W, gy);
  R.crane(ctx, W * 0.72, gy, H * 0.45, S.t, 1);
  ctx.fillStyle = '#8a6844'; ctx.fillRect(0, gy, W, H - gy); ctx.fillStyle = '#5c9e3c'; ctx.fillRect(0, gy, W, 6);
  // wackelndes Fachwerkhaus
  const cam = { X: x => W * 0.3 + x * 26 + Math.sin(S.t * 9) * 3 * Math.max(0, Math.sin(S.t * 0.8)), Y: y => gy - y * 26, s: 26 };
  const sway = Math.sin(S.t * 6) * 0.25 * Math.max(0, Math.sin(S.t * 0.8));
  const n = (x, y) => [x + sway * y / 6, y];
  const mt = mats.length ? mats : [{ color: '#b4783a', dark: '#7a4a1e', width: 0.22, icon: 'holz' }];
  const m0 = mt[0], m1 = mt[Math.min(1, mt.length - 1)];
  for (let k = 0; k < 3; k++) {
    R.drawMember(ctx, cam, n(-2, k * 2), n(-2, k * 2 + 2), m0, {}); R.drawMember(ctx, cam, n(2, k * 2), n(2, k * 2 + 2), m0, {});
    R.drawMember(ctx, cam, n(-2, k * 2 + 2), n(2, k * 2 + 2), m0, {});
    R.drawMember(ctx, cam, n(-2, k * 2), n(2, k * 2 + 2), m1, {}); R.drawMember(ctx, cam, n(2, k * 2), n(-2, k * 2 + 2), m1, {});
  }
  ctx.fillStyle = '#2a7d8c'; const tp = n(0, 6); ctx.fillRect(cam.X(tp[0]) - 60, cam.Y(6) - 34, 120, 34);
  R.worker(ctx, W * 0.12, gy, 22, Math.sin(S.t * 0.8) > 0.3 ? 'panic' : 'cheer', S.t, 0);
  R.worker(ctx, W * 0.55, gy, 22, 'watch', S.t, 2);
  R.worker(ctx, W * 0.9, gy, 20, Math.sin(S.t * 0.8) > 0.3 ? 'panic' : 'idle', S.t, 4);
}
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts; S.t += dt;
  if (S.screen === 'test' && S.sim) {
    S.acc += dt * S.speed; let n = 0;
    while (S.acc >= BB.CFG.dt && n < 8) { stepSim(); S.acc -= BB.CFG.dt; n++; }
    if (n >= 8) S.acc = 0;
  }
  if (S.lv) updateFx(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------------- Knöpfe ----------------
function soundToggle() { SND.init(); prog.muted = !SND.muted; SND.setMuted(prog.muted); save(); updateHUD(); $('titlesound').textContent = prog.muted ? 'Ton aus' : 'Ton an'; if (!prog.muted) SND.click(); }
$('play').onclick = () => { SND.init(); SND.click(); goLevels(); };
$('titlesound').onclick = soundToggle; $('titlesound').textContent = prog.muted ? 'Ton aus' : 'Ton an';
$('lback').onclick = goTitle;
$('unlockall').onclick = () => { prog.unlockAll = !prog.unlockAll; save(); goLevels(); };
$('bback').onclick = () => { if (S.screen === 'test') backToBuild(); goLevels(); };
$('bsound').onclick = soundToggle;
$('binfo').onclick = showIntro;
$('bundo').onclick = () => { if (!S.undo.length) return; S.design = JSON.parse(S.undo.pop()); SND.remove(); changed(); };
$('bdel').onclick = () => { S.del = !S.del; SND.click(); buildToolbar(); if (S.del) toast('Löschen: Tipp auf einen Stab oder Knoten.'); };
$('bstat').onclick = () => { S.showForces = !S.showForces; SND.click(); buildToolbar(); if (S.showForces) toast(S.stat && S.stat.ok ? 'Statik: Stabkräfte in kN (+ Zug, − Druck), grüne Pfeile = Auflagerkräfte' : 'Statik geht erst, wenn das Bauwerk unbeweglich ist.'); };
$('bfit').onclick = () => { fitCam(); SND.click(); };
$('btest').onclick = () => startTest(false);
$('bstop').onclick = backToBuild;
$('bspeed').onclick = () => { S.speed = S.speed === 1 ? 3 : 1; $('bspeed').textContent = '×' + S.speed; SND.click(); };
$('tforces').onclick = () => { S.showForces = !S.showForces; $('tforces').classList.toggle('on', S.showForces); };
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if (document.hidden) SND.stopLoops(); });
resize(); requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

// Testschnittstelle (für automatische Tests)
window.__bb = { S, levels, mats, startLevel, startTest, backToBuild, goLevels, goTitle, stepSim, showResult, changed,
  setDesign(d) { S.design = JSON.parse(JSON.stringify(d)); changed(); }, fitCam };
})();
</script>

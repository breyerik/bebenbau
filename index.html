<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bebenbau">
<meta name="theme-color" content="#ffb703">
<meta name="description" content="Bebenbau – Brücken und Türme bauen, die Lkw, Sturm und Erdbeben aushalten.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Bebenbau</title>
<style>:root { --y: #ffb703; --o: #f57c00; --d: #1e2430; --card: #fffdf6; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #6fb6ec; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, "DejaVu Sans", sans-serif; color: var(--d); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
canvas { position: fixed; inset: 0; touch-action: none; display: block; }
button { font: inherit; border: 0; cursor: pointer; color: inherit; }
.hidden { display: none !important; }
.screen { position: fixed; inset: 0; padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px); display: flex; flex-direction: column; }
#title { align-items: center; justify-content: flex-start; padding-top: calc(var(--safe-t) + 9vh); text-align: center; }
.logo { background: var(--d); border-radius: 14px; padding: 6px 0; width: min(92vw, 400px); box-shadow: 0 8px 0 rgba(0,0,0,0.25); transform: rotate(-2deg); animation: wob 3s ease-in-out infinite; }
@keyframes wob { 0%, 70%, 100% { transform: rotate(-2deg); } 75% { transform: rotate(1deg) translateX(3px); } 80% { transform: rotate(-4deg) translateX(-3px); } 85% { transform: rotate(0deg); } }
.logo h1 { margin: 4px 0; font-size: clamp(44px, 14vw, 64px); letter-spacing: 2px; color: #fff; font-weight: 900; }
.logo h1 span { color: var(--y); }
.stripes { height: 12px; margin: 0 10px; border-radius: 3px; background: repeating-linear-gradient(-45deg, var(--y) 0 12px, var(--d) 12px 24px); }
.tag { font-size: 17px; font-weight: 600; background: rgba(255,255,255,0.75); padding: 10px 14px; border-radius: 12px; margin: 22px 0; }
.tbtns { display: flex; flex-direction: column; gap: 10px; width: min(80vw, 300px); }
.tbtns button, .btns button { background: #fff; padding: 13px 16px; border-radius: 14px; font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 rgba(0,0,0,0.18); }
button.big { background: var(--y) !important; font-size: 20px !important; padding: 15px 18px !important; box-shadow: 0 5px 0 #c98a00 !important; }
button:active { transform: translateY(2px); }
.foot { margin-top: auto; font-size: 12px; opacity: 0.7; background: rgba(255,255,255,0.6); padding: 4px 8px; border-radius: 8px; }
/* Levelauswahl */
#levels { background: linear-gradient(#ffd166, #ffb703); overflow-y: auto; }
.lhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.lhead h2 { margin: 0; flex: 1; font-size: 26px; font-weight: 900; }
#startotal { font-weight: 800; background: var(--d); color: var(--y); padding: 5px 10px; border-radius: 10px; }
#levelgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lvl { position: relative; text-align: left; background: #fffdf6; border-radius: 14px; padding: 10px 10px 8px; min-height: 118px; box-shadow: 0 4px 0 rgba(0,0,0,0.18); display: flex; flex-direction: column; gap: 4px; }
.lvl.quake { background: linear-gradient(160deg, #fffdf6 60%, #ffe1d6); }
.lvl.locked { opacity: 0.55; filter: grayscale(0.8); }
.lnr { font-size: 26px; font-weight: 900; line-height: 1; color: var(--o); }
.lname { font-weight: 800; font-size: 15px; line-height: 1.15; }
.badges { display: flex; flex-wrap: wrap; gap: 3px; }
.badge { font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 6px; color: #fff; background: #555; }
.badge.beben { background: #c1121f; } .badge.sturm { background: #4361ee; } .badge.lkw { background: #6c757d; } .badge.turm { background: #2a9d8f; } .badge.steg { background: #8d6a9f; }
.lstars { margin-top: auto; font-size: 18px; font-weight: 700; }
.st.on { color: #f4a100; text-shadow: 0 1px 0 #a66d00; } .st.off { color: #d9d4c4; }
.linkbtn { background: transparent; text-decoration: underline; margin: 18px auto 6px; font-size: 13px; opacity: 0.75; }
/* HUD */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 6px) 8px 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.top { display: flex; align-items: center; gap: 6px; }
.icon { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.92); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,0.15); flex: none; }
.icon svg { width: 24px; height: 24px; }
#bsound .x { display: none; } #bsound.off .x { display: inline; } #bsound.off .wave { display: none; }
.tmid { flex: 1; min-width: 0; background: rgba(255,255,255,0.92); border-radius: 12px; padding: 4px 10px 5px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
#ltitle { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bwrap { position: relative; height: 18px; background: #e7e2d3; border-radius: 9px; overflow: hidden; margin-top: 2px; }
#budgetbar { position: absolute; left: 0; top: 0; bottom: 0; background: #52b788; transition: width .2s; }
#budgetbar.g2 { background: #95c623; } #budgetbar.g1 { background: #f4a100; } #budgetbar.over { background: #e63946; }
#budget { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 800; line-height: 18px; }
#budget.over { color: #fff; }
#loadchip { margin: 6px auto 0; width: fit-content; max-width: 100%; font-size: 11.5px; font-weight: 700; background: rgba(30,36,48,0.78); color: #fff; padding: 4px 9px; border-radius: 9px; text-align: center; }
#warn { display: none; margin: 6px auto 0; width: fit-content; font-size: 12.5px; font-weight: 800; background: #e63946; color: #fff; padding: 5px 10px; border-radius: 9px; }
#warn.on { display: block; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.75; } }
/* Werkzeuge */
#tools, #testbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 8px calc(var(--safe-b) + 8px); background: rgba(255,253,246,0.95); border-top: 3px solid var(--d); box-shadow: 0 -4px 14px rgba(0,0,0,0.15); }
#tools::before, #testbar::before { content: ""; position: absolute; left: 0; right: 0; top: -9px; height: 6px; background: repeating-linear-gradient(-45deg, var(--y) 0 8px, var(--d) 8px 16px); }
#matinfo { font-size: 12px; text-align: center; margin-bottom: 5px; color: #444; min-height: 15px; }
#mats { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
#mats::-webkit-scrollbar { display: none; }
.mat { flex: 1 0 64px; background: #fff; border-radius: 10px; padding: 5px 3px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid #ddd; }
.mat.sel { border-color: var(--d); background: #ffe8a8; box-shadow: 0 0 0 2px var(--y) inset; }
.sw { width: 34px; height: 8px; border-radius: 3px; display: block; }
.sw.seil { height: 3px; margin: 2px 0 3px; } .sw.beton, .sw.mauer { height: 11px; }
.mn { font-size: 11px; font-weight: 800; white-space: nowrap; } .mc { font-size: 10.5px; color: #666; }
.acts { display: flex; gap: 6px; }
.acts button { flex: 1; background: #fff; border-radius: 12px; padding: 6px 2px 5px; font-size: 11.5px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); border: 2px solid #e5e0d0; }
.acts button svg { width: 22px; height: 22px; }
.acts button.on { background: var(--d); color: var(--y); border-color: var(--d); }
.acts button:disabled { opacity: 0.4; }
.acts button.go { flex: 1.6; background: #2a9d48; color: #fff; border-color: #1f7a37; font-size: 15px; box-shadow: 0 3px 0 #186a2e; }
#bdel.on { background: #e63946; color: #fff; border-color: #b71c2a; }
#bspeed { font-size: 18px; justify-content: center; }
#tstatus { text-align: center; font-weight: 800; font-size: 14px; margin-bottom: 6px; min-height: 18px; }
/* Karten */
#modal { position: fixed; inset: 0; background: rgba(20,24,32,0.35); display: flex; align-items: center; justify-content: center; padding: calc(var(--safe-t) + 12px) 12px calc(var(--safe-b) + 12px); }
#card { width: min(100%, 420px); max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 18px; padding: 16px; box-shadow: 0 10px 0 rgba(0,0,0,0.2); border: 3px solid var(--d); }
#modal:has(#card.bottom) { align-items: flex-end; background: rgba(20,24,32,0.08); }
#card.bottom { max-height: 54vh; }
.ihead h2 { margin: 2px 0 6px; font-size: 25px; font-weight: 900; }
.inr { font-weight: 800; color: var(--o); font-size: 14px; }
.idesc { font-size: 16px; margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.chip { background: var(--d); color: #fff; font-size: 12.5px; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
.ibudget { font-size: 14px; margin: 6px 0; }
.tut { font-size: 14px; padding-left: 18px; margin: 8px 0; background: #fff3c4; border-radius: 10px; padding: 8px 8px 8px 26px; }
.tut li { margin: 3px 0; }
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btns button { flex: 1; }
.btns.small button { font-size: 14px; padding: 9px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); background: #f1ecdc; }
.rhead { text-align: center; }
.rhead h2 { margin: 0; font-size: 30px; font-weight: 900; }
.rhead.win h2 { color: #1f8a3b; } .rhead.fail h2 { color: #d62828; }
.rhead p { margin: 4px 0 6px; font-weight: 600; }
.bigstars { font-size: 40px; line-height: 1.1; }
.explain { background: #fff; border: 2px dashed #c9c2ad; border-radius: 12px; padding: 8px 10px; font-size: 14px; }
.explain p { margin: 4px 0; } .explain .et { font-weight: 800; }
.hl { display: inline-block; background: #ff28c8; color: #fff; font-weight: 800; font-size: 11px; padding: 1px 6px; border-radius: 6px; }
.tog { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; margin-top: 8px; }
.tog input { width: 20px; height: 20px; }
#toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 110px); transform: translate(-50%, -20px); background: var(--d); color: #fff; padding: 9px 14px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (orientation: landscape) and (max-height: 500px) { .tag { margin: 10px 0; } #title { padding-top: 12px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="screen">
  <div class="logo"><div class="stripes"></div><h1>BEBEN<span>BAU</span></h1><div class="stripes"></div></div>
  <p class="tag">Bau es so, dass es hält.<br>Lkw, Sturm und Erdbeben warten schon.</p>
  <div class="tbtns"><button id="play" class="big">Spielen</button><button id="titlesound">Ton an</button></div>
  <p class="foot">Prototyp · Lastfälle: Vegapunk · Bau: Franky</p>
</div>

<div id="levels" class="screen hidden">
  <div class="lhead"><button id="lback" class="icon" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Baustellen</h2><span id="startotal"></span></div>
  <div id="levelgrid"></div>
  <button id="unlockall" class="linkbtn"></button>
</div>

<div id="hud" class="hidden">
  <div class="top">
    <button id="bback" class="icon" aria-label="Levelauswahl"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="tmid"><div id="ltitle"></div><div class="bwrap"><div id="budgetbar"></div><span id="budget"></span></div></div>
    <button id="binfo" class="icon" aria-label="Info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 11v6M12 7.2v.1" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></button>
    <button id="bsound" class="icon" aria-label="Ton"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>
  <div id="loadchip"></div>
  <div id="warn"></div>
</div>

<div id="tools" class="hidden">
  <div id="matinfo"></div>
  <div id="mats"></div>
  <div class="acts">
    <button id="bundo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg>Zurück</button>
    <button id="bdel"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>Löschen</button>
    <button id="bstat"><svg viewBox="0 0 24 24"><path d="M3 19 12 5l9 14zM12 5v14M7.5 12h9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Statik</button>
    <button id="bfit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Ansicht</button>
    <button id="btest" class="go"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>Test</button>
  </div>
</div>

<div id="testbar" class="hidden">
  <div id="tstatus"></div>
  <div class="acts">
    <button id="bstop"><svg viewBox="0 0 24 24"><path d="M14.5 4.5 19.5 9.5 9 20H4v-5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>Bauen</button>
    <button id="bspeed">×1</button>
    <button id="tforces"><svg viewBox="0 0 24 24"><path d="M4 12h13M13 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Kräfte</button>
  </div>
</div>

<div id="modal" class="hidden"><div id="card"></div></div>
<div id="toast"></div>
<script>window.LEVELDATA = {"hinweis": "Spielwerte, an reale Größenordnungen angelehnt, aber für Spielbarkeit vereinfacht. Keine Bemessungswerte. Erdbebenlast als horizontale Ersatzkraft F = pga_g * Masse * g, pulsierend mit frequenz_hz.", "materialien": [{"name": "Holz", "max_zug_kN": 60, "max_druck_kN": 45, "gewicht_kg_pro_m": 8, "kosten_pro_m": 10}, {"name": "Stahlseil", "max_zug_kN": 120, "max_druck_kN": 0, "gewicht_kg_pro_m": 3, "kosten_pro_m": 15}, {"name": "Stahlprofil", "max_zug_kN": 250, "max_druck_kN": 200, "gewicht_kg_pro_m": 25, "kosten_pro_m": 40}, {"name": "Stahlbeton", "max_zug_kN": 30, "max_druck_kN": 400, "gewicht_kg_pro_m": 120, "kosten_pro_m": 30}, {"name": "Mauerwerk", "max_zug_kN": 5, "max_druck_kN": 150, "gewicht_kg_pro_m": 90, "kosten_pro_m": 12}], "levels": [{"nr": 1, "name": "Feldweg", "beschreibung": "Ein Pkw muss über den Graben.", "spannweite_m": 6, "budget": 220, "ankerpunkte": [[0, 0], [6, 0]], "last": {"typ": "lkw", "gewicht_t": 1.5, "geschwindigkeit_kmh": 20}}, {"name": "Baustellenzufahrt", "nr": 2, "beschreibung": "Der Betonmischer kommt. Mittelstütze erlaubt.", "spannweite_m": 10, "budget": 500, "ankerpunkte": [[0, 0], [5, -3], [10, 0]], "last": {"typ": "lkw", "gewicht_t": 12, "geschwindigkeit_kmh": 15}}, {"nr": 3, "name": "Steg an der Alster", "beschreibung": "Fußgängersteg im Herbststurm. Leicht bauen, gut aussteifen.", "spannweite_m": 14, "budget": 900, "ankerpunkte": [[0, 0], [14, 0], [0, 4], [14, 4]], "last": {"typ": "sturm", "wind_kmh": 100, "boen_kmh": 130, "dauer_s": 20}}, {"nr": 4, "name": "Tiefgaragenrampe", "beschreibung": "Lkw mit 20 % Steigung, Bremskraft beachten.", "spannweite_m": 12, "budget": 780, "ankerpunkte": [[0, 0], [12, -2.4], [6, -4]], "last": {"typ": "lkw", "gewicht_t": 18, "geschwindigkeit_kmh": 10, "bremsen": true}}, {"nr": 5, "name": "Erstes Beben", "beschreibung": "Ein dreistöckiger Turm muss ein leichtes Beben überstehen.", "spannweite_m": 6, "budget": 1200, "ankerpunkte": [[0, 0], [3, 0], [6, 0]], "last": {"typ": "erdbeben", "pga_g": 0.1, "dauer_s": 10, "frequenz_hz": 2, "turmhoehe_m": 9, "nutzlast_t": 3}}, {"nr": 6, "name": "Elbbrücke light", "beschreibung": "Große Spannweite, nur zwei Pfeiler. Seile helfen.", "spannweite_m": 30, "budget": 3000, "ankerpunkte": [[0, 0], [30, 0], [10, -6], [20, -6], [0, 8], [30, 8]], "last": {"typ": "lkw", "gewicht_t": 26, "geschwindigkeit_kmh": 40}}, {"nr": 7, "name": "Hochhaus im Sturm", "beschreibung": "Schmaler Turm, Wind von der Seite. Diagonalen sind Pflicht.", "spannweite_m": 8, "budget": 2500, "ankerpunkte": [[0, 0], [8, 0]], "last": {"typ": "sturm", "wind_kmh": 140, "boen_kmh": 180, "dauer_s": 30, "turmhoehe_m": 24}}, {"nr": 8, "name": "Mittleres Beben", "beschreibung": "Mehr Masse oben macht es schlimmer. Leicht und steif bauen.", "spannweite_m": 10, "budget": 2200, "ankerpunkte": [[0, 0], [5, 0], [10, 0]], "last": {"typ": "erdbeben", "pga_g": 0.3, "dauer_s": 15, "frequenz_hz": 1.5, "turmhoehe_m": 15, "nutzlast_t": 8}}, {"nr": 9, "name": "Brücke über der Verwerfung", "beschreibung": "Lkw fährt drüber, während die Erde bebt.", "spannweite_m": 20, "budget": 1800, "ankerpunkte": [[0, 0], [20, 0], [10, -5]], "last": {"typ": "erdbeben", "pga_g": 0.25, "dauer_s": 12, "frequenz_hz": 2.5, "zusatz_lkw_t": 12}}, {"nr": 10, "name": "Das große Beben", "beschreibung": "Endlevel: Turm mit 30 m Höhe, starkes Beben.", "spannweite_m": 12, "budget": 5600, "ankerpunkte": [[0, 0], [4, 0], [8, 0], [12, 0]], "last": {"typ": "erdbeben", "pga_g": 0.5, "dauer_s": 20, "frequenz_hz": 1.2, "turmhoehe_m": 30, "nutzlast_t": 15}}]};</script>
<script>/* Bebenbau – Kern: Konfiguration, Materialien, Hilfsfunktionen */
(function () {
'use strict';
const BB = globalThis.BB = globalThis.BB || {};
const G = 9.81;
const CFG = {
  dt: 1 / 60,
  substeps: 40,
  stiff: 120,          // Dehnsteifigkeit EA = stiff * max. Tragkraft  (=> ca. 0,8 % Dehnung beim Versagen)
  strength: 1.0,       // globaler Faktor auf alle Tragkräfte
  lRef: 6,             // Knicklänge: Druckstäbe länger als lRef verlieren Tragkraft mit (lRef/L)^2
  windDepthBridge: 3,  // m Breite, die bei Brücken Wind fängt (Fahrbahnbreite)
  windDepthTower: 0.25,  // m Breite pro Stab bei Türmen (Planen, Fassade)
  quakeQ: 1.0,         // Verhaltensbeiwert q (Duktilität, vgl. EN 1998): Ersatzkraft F = pga·m·g / q
  damping: 1.0,        // 1/s Geschwindigkeitsdämpfung (~5 % Bauwerksdämpfung)
  jointMass: 5,        // kg pro Knoten (Knotenblech)
  gravRamp: 0.6,       // s Hochlaufzeit der Schwerkraft
  loadStart: 0.8,      // s bis Erdbeben/Wind einsetzen
  maxTime: 90,
  sagLimitMin: 0.6,
};
const STYLE = {
  'holz': { color: '#b4783a', dark: '#7a4a1e', w: 0.22, icon: 'holz' },
  'stahlseil': { color: '#2f343a', dark: '#111', w: 0.07, icon: 'seil' },
  'stahlprofil': { color: '#3f6c99', dark: '#22415f', w: 0.2, icon: 'stahl' },
  'stahlbeton': { color: '#a3a39d', dark: '#6c6c66', w: 0.3, icon: 'beton' },
  'mauerwerk': { color: '#b8553c', dark: '#7b2f1f', w: 0.3, icon: 'mauer' },
};

// ---------------- Test ----------------
function startTest(sameSeed) {

  if (err) { toast(err); SND.remove(); return; }
  SND.init();
  if (!sameSeed) S.seed = 1 + Math.floor(Math.random() * 9999);
  S.sim = new BB.Sim(S.lv, S.design, mats, { seed: S.seed });
  S.screen = 'test'; S.acc = 0; S.doneT = 0; S.resultShown = false; S.highlight = null; S.debris = []; S.particles = []; S.mood = 'watch'; S.bubbles = [];
  show('tools', false); show('testbar', true); show('modal', false); $('warn').classList.remove('on');
  $('bspeed').textContent = '×' + S.speed;
  $('tforces').classList.toggle('on', S.showForces);
  fitCam();
  if (S.lv.quake) say(S.lv.quake.pga >= 0.3 ? 'Festhalten, das wird heftig!' : 'Gleich wackelt es …', 0.6);
  else if (S.lv.wind) say('Helm festhalten!', 0.6);
  else say('Na dann, Gas geben!', 0.3);
  SND.click();
}
function backToBuild() {
  S.screen = 'build'; S.sim = null; S.highlight = null; S.mood = 'idle'; S.debris = []; S.particles = [];
  show('testbar', false); show('tools', true); show('modal', false); SND.stopLoops(); updateHUD(); fitCam();
}
function say(text, delay) { S.bubbles = S.bubbles.filter(b => b.t0 > S.t + (delay || 0)); S.bubbles.push({ text, t0: S.t + (delay || 0), dur: 2.2 }); }
function stepSim() {
  const sim = S.sim;
  if (sim.done) { S.doneT += 1 / 60; if (S.doneT > 4) return; }
  const fallenBefore = sim.vehicles.filter(v => v.state === 'fall').length;
  const ev = sim.step();
  for (const e of ev) if (e.type === 'break') onBreak(e);
  if (sim.vehicles.filter(v => v.state === 'fall').length > fallenBefore) { SND.thud(); vib([60, 40, 60]); S.shake += 6; S.mood = 'panic'; say(sim.vehicles.some(v => v.state === 'fall' && v.kind === 'worker') ? 'Kollege, halt dich fest!' : 'Ach du Schande!'); }

function vib(p) { try { if (!SND.muted && navigator.vibrate) navigator.vibrate(p); } catch (e) { /* nicht unterstützt */ } }
function onBreak(e) {
  const heavy = /beton|mauer|stahlprofil/i.test(e.mat.name);
  SND.crack(heavy); vib(25); S.shake = Math.min(14, S.shake + (heavy ? 6 : 3));
  if (S.mood !== 'panic') { S.mood = 'panic'; say(['Da kracht was!', 'Oha!', 'Wer hat das gerechnet?!'][Math.floor(Math.random() * 3)]); }

      vx: e.vx * 0.5 + (Math.random() - 0.5) * 3, vy: e.vy * 0.5 + Math.random() * 3, va: (Math.random() - 0.5) * 6, mat: e.mat, life: 6 });
  }
  for (let k = 0; k < 14; k++) S.particles.push({ x: mx, y: my, vx: (Math.random() - 0.5) * 6, vy: Math.random() * 5, life: 0.6 + Math.random() * 0.6, c: e.mat.color, r: 1 + Math.random() * 3 });
}
function showResult() {
  S.resultShown = true;
  const sim = S.sim, lv = S.lv, res = sim.result;
  const cost = BB.designCost(S.design, mats), over = cost > lv.budget;
  const st = res.win && !over ? BB.stars(cost, lv.budget) : 0;
  if (st > (prog.stars[lv.nr] || 0)) { prog.stars[lv.nr] = st; save(); }
  S.mood = res.win ? 'cheer' : 'panic';
  if (res.win) { SND.win(); say(over ? 'Hält, aber der Chef flucht über die Rechnung.' : ['Hält!', 'Statik passt!', 'Feierabend!', 'Läuft, Chef!'][Math.floor(Math.random() * 4)]); vib(40); }
  else { SND.fail(); vib([100, 50, 100]); }
  SND.stopLoops();
  const ex = BB.Explain.explain(sim, S.stat);
  S.highlight = ex.memberId;
  const next = S.li + 1 < levels.length ? S.li + 1 : -1;
  const head = res.win ? (over ? 'Hält – aber zu teuer!' : 'Hält!') : 'Eingestürzt!';
  const sub = res.win ? (over ? `Kosten ${cost} €, Budget ${lv.budget} €. Spar noch ${cost - lv.budget} € ein.` : `Kosten ${cost} von ${lv.budget} €`) : esc(res.reason || 'Das Bauwerk hat nicht gehalten.');
  modal(`<div class="rhead ${res.win ? 'win' : 'fail'}"><h2>${head}</h2>${res.win && !over ? `<div class="bigstars">${stars(st)}</div>` : ''}<p>${sub}</p></div>
    <div class="explain">${ex.memberId ? `<span class="hl">Stab ${ex.memberId}</span> ` : ''}<p class="et">${esc(ex.title || '')}</p>${ex.lines.map(l => `<p>${esc(l)}</p>`).join('')}</div>
    <label class="tog"><input type="checkbox" id="cforces" ${S.showForces ? 'checked' : ''}> Kräfte und Auflagerkräfte anzeigen</label>
    <div class="btns">${res.win && !over && next >= 0 ? '<button class="big" id="rnext">Weiter</button>' : ''}<button class="${res.win && !over ? '' : 'big'}" id="rbuild">${res.win ? 'Verbessern' : 'Nachbessern'}</button></div>
    <div class="btns small"><button id="rreplay">Nochmal ansehen</button><button id="rlevels">Levelauswahl</button></div>`);
  $('card').classList.add('bottom');
  requestAnimationFrame(() => { // Kamera so setzen, dass das Bauwerk über der Karte sichtbar bleibt
    const top = $('hud').getBoundingClientRect().bottom + 6, bot = $('card').getBoundingClientRect().top - 6;

  $('rbuild').onclick = () => { $('card').classList.remove('bottom'); backToBuild(); };
  $('rreplay').onclick = () => { $('card').classList.remove('bottom'); startTest(true); };
  $('rlevels').onclick = () => { $('card').classList.remove('bottom'); goLevels(); };
}

// ---------------- Zeichnen ----------------
function updateFx(dt) {

    const gy = BB.groundAt(S.lv, d.x) + 0.1;
    if (d.y < gy) { d.y = gy; d.vy *= -0.3; d.vx *= 0.6; d.va *= 0.5; }
  }
  S.debris = S.debris.filter(d => d.life > 0);
  for (const p of S.particles) { p.vy -= 6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  S.particles = S.particles.filter(p => p.life > 0);
  S.shake *= Math.pow(0.02, dt);
  S.bubbles = S.bubbles.filter(b => S.t < b.t0 + b.dur);
}
function bystanders() {

  return [[lv.roadB.x + 1.2, lv.roadB.y], [lv.roadB.x + 2.2, lv.roadB.y]];
}

  }

$('bback').onclick = () => { if (S.screen === 'test') backToBuild(); goLevels(); };
$('bsound').onclick = soundToggle;
$('binfo').onclick = showIntro;
$('bundo').onclick = () => { if (!S.undo.length) return; S.design = JSON.parse(S.undo.pop()); SND.remove(); changed(); };
$('bdel').onclick = () => { S.del = !S.del; SND.click(); buildToolbar(); if (S.del) toast('Löschen: Tipp auf einen Stab oder Knoten.'); };
$('bstat').onclick = () => { S.showForces = !S.showForces; SND.click(); buildToolbar(); if (S.showForces) toast(S.stat && S.stat.ok ? 'Statik: Stabkräfte in kN (+ Zug, − Druck), grüne Pfeile = Auflagerkräfte' : 'Statik geht erst, wenn das Bauwerk unbeweglich ist.'); };
$('bfit').onclick = () => { fitCam(); SND.click(); };
$('btest').onclick = () => startTest(false);
$('bstop').onclick = backToBuild;
$('bspeed').onclick = () => { S.speed = S.speed === 1 ? 3 : 1; $('bspeed').textContent = '×' + S.speed; SND.click(); };
$('tforces').onclick = () => { S.showForces = !S.showForces; $('tforces').classList.toggle('on', S.showForces); };
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if (document.hidden) SND.stopLoops(); });
resize(); requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

// Testschnittstelle (für automatische Tests)
window.__bb = { S, levels, mats, startLevel, startTest, backToBuild, goLevels, goTitle, stepSim, showResult, changed,
  setDesign(d) { S.design = JSON.parse(JSON.stringify(d)); changed(); }, fitCam };
})();
</script>
